name: WONI WEDDING - Auto Publish

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: woni-wedding-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.sync.outputs.publish }}
    steps:
      - name: Check out existing website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install public Neon reader
        run: npm install --no-save --package-lock=false --ignore-scripts @neondatabase/neon-js@0.7.0-beta

      - name: Read approved public release from Neon
        id: sync
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@neondatabase/neon-js';
          import { createHash } from 'node:crypto';
          import { appendFileSync, existsSync, readFileSync, writeFileSync } from 'node:fs';

          const client = createClient({
            auth: {
              url: 'https://ep-curly-block-b5ue1v7o.neonauth.c-7.us-east-2.aws.neon.tech/neondb/auth',
              allowAnonymous: true,
            },
            dataApi: {
              url: 'https://ep-curly-block-b5ue1v7o.apirest.c-7.us-east-2.aws.neon.tech/neondb/rest/v1',
            },
          });

          const { data, error } = await client
            .from('wedding_public_releases')
            .select('version,html_source,html_sha256,published_at')
            .eq('channel', 'production')
            .order('version', { ascending: false })
            .limit(1);

          if (error) throw new Error(`Neon public release lookup failed: ${error.message || error.code}`);
          if (!Array.isArray(data) || data.length !== 1) throw new Error('No public production release available. Refusing to deploy.');

          const row = data[0];
          const html = row.html_source;

          if (!Number.isInteger(Number(row.version)) || Number(row.version) < 1) {
            throw new Error('Invalid release version.');
          }

          if (
            typeof html !== 'string' ||
            Buffer.byteLength(html, 'utf8') < 5000 ||
            Buffer.byteLength(html, 'utf8') > 1000000
          ) {
            throw new Error('Invalid HTML payload size.');
          }

          if (
            !/^<!doctype html>/i.test(html.trimStart()) ||
            !html.includes('<title>WONI WEDDING</title>') ||
            !html.includes('</html>')
          ) {
            throw new Error('Not a WONI WEDDING HTML document.');
          }

          if (/WONI-0522-8989|postgres(?:ql)?:\/\//i.test(html)) {
            throw new Error('Possible hard-coded secret in public HTML.');
          }

          const sha256 = createHash('sha256')
            .update(html, 'utf8')
            .digest('hex');

          if (sha256 !== row.html_sha256) {
            throw new Error('Neon release SHA-256 mismatch. Nothing will deploy.');
          }

          const meta =
            JSON.stringify(
              {
                channel: 'production',
                version: Number(row.version),
                sha256,
                published_at: row.published_at,
              },
              null,
              2
            ) + '\n';

          const indexPath = 'index.html';
          const metaPath = '.woni-release.json';

          const oldHtml = existsSync(indexPath)
            ? readFileSync(indexPath, 'utf8')
            : '';

          const oldMeta = existsSync(metaPath)
            ? readFileSync(metaPath, 'utf8')
            : '';

          const changed = oldHtml !== html || oldMeta !== meta;

          if (changed) {
            writeFileSync(indexPath, html, 'utf8');
            writeFileSync(metaPath, meta, 'utf8');
          }

          const publish =
            changed || process.env.FORCE_PUBLISH === 'true';

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `changed=${changed}\npublish=${publish}\nversion=${row.version}\n`
          );

          console.log(
            `WONI release v${row.version}; SHA256 verified; changed=${changed}; deploy=${publish}`
          );
          NODE

      - name: Commit approved source to main
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .woni-release.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish WONI WEDDING release v${{ steps.sync.outputs.version }}"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        if: steps.sync.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare website artifact
        if: steps.sync.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        if: steps.sync.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
