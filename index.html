<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#7f3342" />
  <title>WONI WEDDING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
  :root{--bg:#f8f3ed;--fg:#2f2728;--surface:#f1e8df;--card:#fffaf5;--paper:#fffdf9;--primary:#7f3342;--accent:#a66a76;--muted:#76696a;--line:#ded1c9;--success:#5e7966;--error:#a24e50;--shadow:0 14px 34px rgba(74,48,52,.09)}
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',sans-serif}.hidden{display:none!important}
  button,input,select{font:inherit}.shell{min-height:100vh}.topbar{height:76px;display:flex;align-items:center;gap:24px;padding:0 32px;position:sticky;top:0;z-index:20;background:rgba(248,243,237,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;min-width:200px}.brandMark{width:36px;height:36px;border:1px solid var(--primary);border-radius:50%;display:grid;place-items:center;font:600 20px 'Noto Serif KR',serif;color:var(--primary)}.brand b{font-family:'Noto Serif KR',serif;font-size:15px}.brand small,.task small,td small,.bottom small{display:block;color:var(--muted);font-size:10px}
  .topbar nav{display:flex;flex:1;gap:4px;overflow:auto}.topbar nav a{display:flex;align-items:center;gap:5px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;padding:10px 9px;border-radius:999px;white-space:nowrap}.topbar nav a:hover{background:#eadfd7;color:var(--primary)}
  .ghost{border:0;background:transparent;color:var(--muted);cursor:pointer}.main{max-width:1440px;margin:auto;padding:46px 38px 80px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;padding:28px 4px 44px;border-bottom:1px solid var(--line)}
  .eyebrow{color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.16em;margin:0 0 10px}.hero h1,.authCard h1{font:600 clamp(30px,4vw,56px)/1.18 'Noto Serif KR',serif;margin:0;letter-spacing:-.04em}.hero>div>p:last-child{color:var(--muted);font-size:15px}.dday{text-align:right}.dday span{font-size:10px;letter-spacing:.2em;color:var(--muted)}.dday strong{display:block;font:600 clamp(42px,6vw,78px)/1 'Noto Serif KR',serif;color:var(--primary);margin:5px 0}.dday small{color:var(--muted);font-size:11px}
  .nextGrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin:24px 0 34px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(74,48,52,.06)}.card h3{display:flex;align-items:center;gap:8px;color:var(--primary);font-size:12px;margin:0 0 14px}
  .task{width:100%;display:flex;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 0;text-align:left;cursor:pointer}.task:first-of-type{border-top:0}.task>span:last-child{flex:1}.task b{font-size:13px}.num{font-family:'Noto Serif KR',serif;color:var(--accent);font-size:12px}.done{text-decoration:line-through;color:var(--muted)}.check{font-size:18px;width:20px}
  .event{display:flex;gap:18px;align-items:center}.date{width:72px;height:86px;border:1px solid var(--primary);border-radius:16px;display:grid;place-items:center;background:var(--surface)}.date b{font:600 34px/1 'Noto Serif KR',serif;color:var(--primary)}.date span{font-size:10px;letter-spacing:.18em;color:var(--primary)}.event h2{font:600 18px 'Noto Serif KR',serif;margin:4px 0}.payment span,.payment small{display:block;color:var(--muted);font-size:11px}.payment strong{display:block;font:600 28px 'Noto Serif KR',serif;color:var(--primary);margin:8px 0}
  .master{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.sectionTitle{display:flex;justify-content:space-between;align-items:end;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}.sectionTitle h2{font:600 28px 'Noto Serif KR',serif;margin:0}.sectionTitle>p{font-size:12px;color:var(--muted)}.money{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.money>div{padding:20px 18px;border-right:1px solid var(--line)}.money>div:last-child{border-right:0}.money span,.money small{display:block;color:var(--muted);font-size:10px}.money strong{display:block;font:600 22px 'Noto Serif KR',serif;color:var(--primary);margin:6px 0}
  .tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th{text-align:left;color:var(--muted);font-size:10px;padding:13px 10px;border-bottom:1px solid var(--line)}td{font-size:12px;padding:14px 10px;border-bottom:1px solid #eee4de;vertical-align:middle}td b{display:block}.category{color:var(--accent);font-size:10px;font-weight:700}.warn{color:var(--error)!important}.status{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eadfd7;font-size:9px;font-weight:700}.s-완료{background:#e5ece6;color:#4f6b57}.s-확정{background:#eee2e5;color:#7f3342}.s-진행중{background:#efe8dd;color:#8a6034}.s-확인필요{background:#f1dfdf;color:#95484a}
  .bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.bottom article{display:flex;gap:14px;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.bottom span{display:block;color:var(--accent);font-size:9px;letter-spacing:.16em;font-weight:700}.bottom b{display:block;font:600 17px 'Noto Serif KR',serif;margin:5px 0}
  .center{min-height:100vh;display:grid;place-items:center;padding:24px}.paper,.authCard{width:min(100%,470px);padding:34px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.authCard{display:grid;gap:14px}.loginMark{width:52px;height:52px;border:1px solid var(--primary);border-radius:50%;display:grid;place-items:center;color:var(--primary);font-family:'Noto Serif KR',serif;font-size:22px}.authCard>p{color:var(--muted);font-size:12px;line-height:1.7}.authCard label,.modal label{display:grid;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--fg)}.privateNote{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:11px;color:var(--muted);line-height:1.6}.loginError{padding:10px 12px;border-radius:12px;background:#f1dfdf;color:var(--error);font-size:11px}.primary,.secondary{padding:11px 16px;border-radius:12px;font-weight:700;cursor:pointer}.primary{border:1px solid var(--primary);background:var(--primary);color:#fffaf7}.secondary{border:1px solid var(--line);background:transparent;color:var(--fg)}
  .tabs{display:flex;gap:8px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700}.tabs button.active{background:var(--surface);color:var(--primary);border-color:#cdbac0}
  .modalBack{position:fixed;inset:0;background:rgba(47,39,40,.4);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 22px 52px rgba(74,48,52,.18)}.modal h2{font:600 24px 'Noto Serif KR',serif;margin:0}.modal>p{color:var(--muted);font-size:11px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.muted{color:var(--muted)}.mini{font-size:11px}
  @media(max-width:1000px){.topbar{padding:0 18px}.brand{min-width:auto}.brand>div{display:none}.main{padding:34px 20px 70px}.nextGrid{grid-template-columns:1fr 1fr}.nextGrid>.card:first-child{grid-column:1/-1}.money{grid-template-columns:1fr 1fr}}
  @media(max-width:680px){.topbar{height:64px;padding:0 14px}.topbar nav a{padding:10px 8px;font-size:0}.topbar nav a span{font-size:17px}.main{padding:22px 14px 54px}.hero{flex-direction:column;align-items:flex-start;padding:18px 2px 26px}.hero h1{font-size:34px}.dday{text-align:left}.dday strong{font-size:54px}.nextGrid{grid-template-columns:1fr}.nextGrid>.card:first-child{grid-column:auto}.master{padding:18px 14px}.sectionTitle{align-items:flex-start;flex-direction:column}.sectionTitle>p{display:none}.money>div{padding:16px 10px}.money strong{font-size:18px}.bottom{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
<div id="app" class="center"><div class="paper"><p class="eyebrow">WONI WEDDING</p><h2>웨딩 마스터 불러오는 중</h2><p class="muted mini">Neon에 안전하게 연결하고 있어.</p></div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@neondatabase/neon-js@0.7.0-beta';

const DATABASE_URL = 'https://ep-curly-block-b5ue1v7o.c-7.us-east-2.aws.neon.tech/neondb';
const client = createClient(DATABASE_URL);
const app = document.querySelector('#app');
let dataCache = null;
let draft = null;
let initializedCache = null;

const esc = (v='') => String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n===null || n===undefined || n==='') ? '미정' : new Intl.NumberFormat('ko-KR').format(Number(n))+'원';
const isoDate = v => v ? String(v).slice(0,10) : '';
const statusClass = s => 's-'+String(s||'').replaceAll(' ','');
const dday = iso => { const diff=Math.ceil((new Date(iso).getTime()-Date.now())/86400000); return diff>0?`D-${diff}`:diff===0?'D-DAY':`D+${Math.abs(diff)}`; };
const sum = (arr,key) => arr.reduce((s,x)=>s+(x[key]==null?0:Number(x[key])),0);

async function isInitialized(){
  if(initializedCache!==null) return initializedCache;
  const {data,error}=await client.rpc('wedding_is_initialized');
  if(error) throw error;
  initializedCache = !!data;
  return initializedCache;
}
async function getSession(){
  const {data,error}=await client.auth.getSession();
  if(error) return null;
  return data?.session ? data : null;
}
async function isOwner(){
  const {data,error}=await client.rpc('is_wedding_owner');
  if(error) return false;
  return !!data;
}
function msg(text, type=''){
  const el=document.querySelector('#auth-msg');
  if(!el) return;
  el.textContent=text||'';
  el.className = text ? (type==='error'?'loginError':'privateNote') : 'hidden';
}
function loading(text='웨딩 마스터 불러오는 중'){
  app.className='center';
  app.innerHTML=`<div class="paper"><p class="eyebrow">WONI WEDDING</p><h2>${esc(text)}</h2><p class="muted mini">잠시만 기다려줘.</p></div>`;
}
async function boot(){
  try{
    loading();
    const init=await isInitialized();
    const session=await getSession();
    if(!session){ renderAuth(init); return; }
    if(await isOwner()){ await loadWedding(); return; }
    if(!init){ renderClaim(session.user); return; }
    renderUnauthorized(session.user);
  }catch(e){
    console.error(e);
    app.className='center';
    app.innerHTML=`<div class="paper"><p class="eyebrow">WONI WEDDING</p><h2>연결 오류</h2><p class="muted mini">Neon 연결을 다시 확인해줘.</p></div>`;
  }
}
function renderAuth(initialized){
  app.className='center';
  app.innerHTML=`<section class="authCard">
    <div class="loginMark">W</div>
    <p class="eyebrow">PRIVATE WEDDING JOURNAL</p>
    <h1>WONI WEDDING</h1>
    <p>2027.05.22 결혼 준비를 위한 개인 공간이야. 웨딩 데이터는 소유자 계정으로 로그인한 뒤에만 보여.</p>
    <div class="tabs">
      <button id="tab-login" class="${initialized?'active':''}">로그인</button>
      ${initialized?'':`<button id="tab-setup" class="active">최초 설정</button>`}
    </div>
    <div id="auth-msg" class="hidden"></div>
    <form id="login-form" class="${initialized?'':'hidden'}">
      <label>이메일<input name="email" type="email" autocomplete="email" required></label>
      <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">로그인</button>
    </form>
    ${initialized?'':`<form id="setup-form">
      <label>이름<input name="name" value="Woni" required></label>
      <label>이메일<input name="email" type="email" autocomplete="email" required></label>
      <label>새 비밀번호<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>소유자 설정 코드<input name="token" autocomplete="off" required></label>
      <div class="privateNote">최초 1회만 사용해. 소유자 확정 후에는 이 설정 화면이 자동으로 사라져.</div>
      <button class="primary" type="submit">내 소유자 계정 만들기</button>
    </form>`}
  </section>`;
  const login=document.querySelector('#login-form');
  const setup=document.querySelector('#setup-form');
  document.querySelector('#tab-login')?.addEventListener('click',()=>{
    login?.classList.remove('hidden'); setup?.classList.add('hidden');
    document.querySelector('#tab-login')?.classList.add('active');
    document.querySelector('#tab-setup')?.classList.remove('active');
  });
  document.querySelector('#tab-setup')?.addEventListener('click',()=>{
    setup?.classList.remove('hidden'); login?.classList.add('hidden');
    document.querySelector('#tab-setup')?.classList.add('active');
    document.querySelector('#tab-login')?.classList.remove('active');
  });
  login?.addEventListener('submit', loginSubmit);
  setup?.addEventListener('submit', setupSubmit);
}
async function loginSubmit(e){
  e.preventDefault(); msg('로그인 중...');
  const fd=new FormData(e.currentTarget);
  const {error}=await client.auth.signIn.email({email:String(fd.get('email')).trim(),password:String(fd.get('password'))});
  if(error){msg(error.message||'로그인에 실패했어.','error');return;}
  initializedCache=null; await boot();
}
async function setupSubmit(e){
  e.preventDefault(); msg('소유자 계정 만드는 중...');
  const fd=new FormData(e.currentTarget);
  const email=String(fd.get('email')).trim(), password=String(fd.get('password')), name=String(fd.get('name')).trim(), token=String(fd.get('token')).trim();
  let res=await client.auth.signUp.email({email,password,name});
  if(res.error){
    const sign=await client.auth.signIn.email({email,password});
    if(sign.error){msg(res.error.message||'계정 생성에 실패했어.','error');return;}
  }
  const claim=await client.rpc('claim_wedding_owner',{p_token:token});
  if(claim.error || !claim.data){msg('설정 코드가 다르거나 이미 소유자 설정이 끝났어.','error');return;}
  initializedCache=true; await boot();
}
function renderClaim(user){
  app.className='center';
  app.innerHTML=`<section class="authCard">
    <div class="loginMark">W</div><p class="eyebrow">OWNER SETUP</p><h1>소유자 확인</h1>
    <p>${esc(user?.email||'로그인된 계정')} 계정이 로그인돼 있어. 최초 설정 코드만 확인하면 끝이야.</p>
    <div id="auth-msg" class="hidden"></div>
    <form id="claim-form"><label>소유자 설정 코드<input name="token" required></label><button class="primary" type="submit">이 계정을 소유자로 확정</button></form>
    <button id="logout-alone" class="secondary">다른 계정으로 로그인</button>
  </section>`;
  document.querySelector('#claim-form').addEventListener('submit',async e=>{
    e.preventDefault(); msg('확인 중...');
    const token=String(new FormData(e.currentTarget).get('token')).trim();
    const {data,error}=await client.rpc('claim_wedding_owner',{p_token:token});
    if(error||!data){msg('설정 코드가 맞지 않아.','error');return;}
    initializedCache=true; await boot();
  });
  document.querySelector('#logout-alone').addEventListener('click',logout);
}
function renderUnauthorized(user){
  app.className='center';
  app.innerHTML=`<section class="authCard"><div class="loginMark">W</div><p class="eyebrow">PRIVATE</p><h1>접근할 수 없는 계정</h1>
  <p>${esc(user?.email||'현재 계정')}은 WONI WEDDING 소유자 계정이 아니야.</p><button id="logout-alone" class="primary">로그아웃</button></section>`;
  document.querySelector('#logout-alone').addEventListener('click',logout);
}
async function logout(){
  await client.auth.signOut();
  dataCache=null; initializedCache=null; await boot();
}
async function loadWedding(){
  loading('웨딩 데이터 불러오는 중');
  const [s,v,t]=await Promise.all([
    client.from('wedding_settings').select('*').eq('id',1).limit(1),
    client.from('wedding_vendors').select('*').order('sort_order',{ascending:true}),
    client.from('wedding_tasks').select('*').order('sort_order',{ascending:true})
  ]);
  const err=s.error||v.error||t.error;
  if(err){console.error(err);renderUnauthorized((await getSession())?.user);return;}
  dataCache={settings:s.data?.[0],vendors:v.data||[],tasks:t.data||[]};
  renderHome();
}
function renderHome(){
  const {settings,vendors,tasks}=dataCache;
  const trackedTotal=sum(vendors,'total_amount'), paidTotal=sum(vendors,'paid_amount'), knownBalance=sum(vendors,'balance_amount'), discountTotal=sum(vendors,'discount_amount'), netKnownBalance=knownBalance-discountTotal;
  const shootBalance=vendors.filter(x=>isoDate(x.booking_date)==='2026-10-16').reduce((s,x)=>s+(x.balance_amount?Number(x.balance_amount):0),0);
  app.className='shell';
  app.innerHTML=`
  <header class="topbar"><div class="brand"><span class="brandMark">W</span><div><b>WONI WEDDING</b><small>2027 · 05 · 22</small></div></div>
  <nav><a href="#top"><span>♡</span>HOME</a><a href="#tasks"><span>◷</span>TIMELINE</a><a href="#vendors"><span>▤</span>VENDORS</a><a href="#money"><span>₩</span>MONEY</a><a href="#tasks"><span>✓</span>CHECKLIST</a><a href="#photo"><span>▧</span>PHOTO BOOK</a></nav>
  <button id="logout" class="ghost" title="로그아웃">↪</button></header>
  <main class="main" id="top">
   <section class="hero"><div><p class="eyebrow">OUR WEDDING JOURNAL</p><h1>결혼 준비, 지금 해야 할 것만.</h1><p>2027년 5월 22일 오후 2시 · ${esc(settings?.venue_name||'비렌티 웨딩홀')}</p></div><div class="dday"><span>WEDDING</span><strong>${dday(settings?.wedding_date||'2027-05-22T14:00:00+09:00')}</strong><small>2027.05.22 · SAT · 2:00 PM</small></div></section>
   <section class="nextGrid" id="tasks">
    <article class="card"><h3>✓ 다음 해야 할 일</h3>${tasks.map((x,i)=>`<button class="task" data-task="${x.id}" data-done="${x.completed}"><span class="check">${x.completed?'✓':'○'}</span><span class="num">0${i+1}</span><span><b class="${x.completed?'done':''}">${esc(x.title)}</b><small>${esc(x.task_status)} · ${isoDate(x.due_date)||'일정 미정'}</small></span></button>`).join('')}</article>
    <article class="card"><h3>◷ 다음 일정</h3><div class="event"><div class="date"><b>16</b><span>OCT</span></div><div><p class="eyebrow">WEDDING SHOOT</p><h2>천안 VOHR 웨딩촬영</h2><small>2026.10.16</small></div></div></article>
    <article class="card"><h3>₩ 다음 결제</h3><div class="payment"><span>10월 촬영 관련 알려진 잔금</span><strong>${won(shootBalance)}</strong><small>원본 · 헤어변형 · 헬퍼 · 플라워 · 출장비</small></div></article>
   </section>
   <section class="master" id="vendors"><div class="sectionTitle"><div><p class="eyebrow">MASTER · LIVE</p><h2>현재 계약 현황</h2></div><p>수정한 값은 Neon DB에 저장돼.</p></div>
    <div class="money" id="money"><div><span>현재 파악 총액</span><strong>${won(trackedTotal)}</strong><small>총액 미정 제외</small></div><div><span>현재 납부 기록</span><strong>${won(paidTotal)}</strong><small>확인된 납부액</small></div><div><span>알려진 잔금</span><strong>${won(knownBalance)}</strong><small>할인 전</small></div><div><span>최대 혜택 반영 시</span><strong>${won(netKnownBalance)}</strong><small>기록된 할인/페이백 최대 ${won(discountTotal)} · 일부 조건부</small></div></div>
    <div class="tableWrap"><table><thead><tr><th>카테고리</th><th>업체 / 내용</th><th>상태</th><th>총액</th><th>낸 돈</th><th>잔금</th><th>일정</th><th></th></tr></thead><tbody>${vendors.map(x=>`<tr><td class="category">${esc(x.category)}</td><td><b>${esc(x.vendor_name)}</b><small>${esc(x.product_name)}</small>${x.confirmation_needed?`<small class="warn">확인: ${esc(x.confirmation_needed)}</small>`:''}</td><td><span class="status ${statusClass(x.contract_status)}">${esc(x.contract_status)}</span></td><td>${won(x.total_amount)}</td><td>${won(x.paid_amount)}</td><td>${won(x.balance_amount)}</td><td>${isoDate(x.booking_date)||'미정'}<small>결제 ${isoDate(x.payment_due)||'미정'}</small></td><td><button class="ghost edit" data-id="${x.id}">✎</button></td></tr>`).join('')}</tbody></table></div>
   </section>
   <section class="bottom"><article id="photo"><div>▧</div><div><span>PHOTO BOOK</span><b>촬영 레퍼런스는 기존 자료 유지</b><small>2026.10.16 · Bright 70 / Mood 30</small></div></article><article><div>♡</div><div><span>WEDDING DAY</span><b>본식 운영 정보는 다음 단계</b><small>혼주 · 식순 · 스냅 · DVD · 플라워</small></div></article></section>
  </main><div id="modal-root"></div>`;
  document.querySelector('#logout').addEventListener('click',logout);
  document.querySelectorAll('[data-task]').forEach(btn=>btn.addEventListener('click',()=>toggleTask(Number(btn.dataset.task),btn.dataset.done!=='true')));
  document.querySelectorAll('.edit').forEach(btn=>btn.addEventListener('click',()=>openEdit(Number(btn.dataset.id))));
}
async function toggleTask(id,completed){
  const {error}=await client.from('wedding_tasks').update({completed}).eq('id',id).select();
  if(error){alert('체크리스트 저장에 실패했어.');console.error(error);return;}
  await loadWedding();
}
function openEdit(id){
  const v=dataCache.vendors.find(x=>Number(x.id)===id); if(!v)return; draft={...v};
  const root=document.querySelector('#modal-root');
  root.innerHTML=`<div class="modalBack"><div class="modal"><h2>계약 정보 수정</h2><p>저장하면 Neon DB에 바로 반영돼.</p>
  <form id="vendor-form"><div class="formGrid">
  <label>업체명<input name="vendor_name" value="${esc(v.vendor_name)}"></label>
  <label>상품/내용<input name="product_name" value="${esc(v.product_name)}"></label>
  <label>상태<select name="contract_status">${['확정','진행 중','완료','미정','확인 필요'].map(x=>`<option ${x===v.contract_status?'selected':''}>${x}</option>`).join('')}</select></label>
  <label>신뢰도<select name="confidence">${['높음','중간','낮음'].map(x=>`<option ${x===v.confidence?'selected':''}>${x}</option>`).join('')}</select></label>
  ${[['총액','total_amount'],['계약금','deposit_amount'],['결제 완료','paid_amount'],['잔금','balance_amount'],['할인/페이백','discount_amount']].map(([l,k])=>`<label>${l}<input name="${k}" type="number" value="${v[k]??''}"></label>`).join('')}
  <label>예약/방문 일정<input name="booking_date" type="date" value="${isoDate(v.booking_date)}"></label>
  <label>결제 예정일<input name="payment_due" type="date" value="${isoDate(v.payment_due)}"></label>
  <label>담당자<input name="contact_person" value="${esc(v.contact_person||'')}"></label>
  <label class="wide">확인 필요사항<input name="confirmation_needed" value="${esc(v.confirmation_needed||'')}"></label>
  <label class="wide">메모<input name="memo" value="${esc(v.memo||'')}"></label>
  </div><div class="actions"><button type="button" id="cancel" class="secondary">취소</button><button class="primary" type="submit">DB에 저장</button></div></form>
  </div></div>`;
  root.querySelector('.modalBack').addEventListener('click',e=>{if(e.target.classList.contains('modalBack'))root.innerHTML='';});
  root.querySelector('#cancel').addEventListener('click',()=>root.innerHTML='');
  root.querySelector('#vendor-form').addEventListener('submit',saveVendor);
}
async function saveVendor(e){
  e.preventDefault(); const fd=new FormData(e.currentTarget);
  const nullNum=n=>fd.get(n)===''?null:Number(fd.get(n));
  const payload={
    vendor_name:String(fd.get('vendor_name')||''),product_name:String(fd.get('product_name')||''),
    contract_status:String(fd.get('contract_status')||''),confidence:String(fd.get('confidence')||''),
    total_amount:nullNum('total_amount'),deposit_amount:nullNum('deposit_amount'),paid_amount:nullNum('paid_amount'),
    balance_amount:nullNum('balance_amount'),discount_amount:nullNum('discount_amount')??0,
    booking_date:String(fd.get('booking_date')||'')||null,payment_due:String(fd.get('payment_due')||'')||null,
    contact_person:String(fd.get('contact_person')||'')||null,confirmation_needed:String(fd.get('confirmation_needed')||''),
    memo:String(fd.get('memo')||''),updated_at:new Date().toISOString()
  };
  const {error}=await client.from('wedding_vendors').update(payload).eq('id',draft.id).select();
  if(error){alert('저장에 실패했어.');console.error(error);return;}
  document.querySelector('#modal-root').innerHTML=''; await loadWedding();
}
boot();
</script>
</body>
</html>
