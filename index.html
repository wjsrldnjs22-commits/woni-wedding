<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#7f3342" />
  <meta name="woni-bootstrap" content="1" />
  <title>WONI WEDDING</title>
  <style>
    :root{--bg:#f8f3ed;--fg:#2f2728;--paper:#fffdf9;--primary:#7f3342;--muted:#76696a;--line:#ded1c9;--shadow:0 14px 34px rgba(74,48,52,.09)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}
    body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    article{width:min(100%,470px);padding:34px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
    .mark{width:52px;height:52px;border:1px solid var(--primary);border-radius:50%;display:grid;place-items:center;color:var(--primary);font:500 22px Georgia,serif;margin-bottom:24px}
    .eyebrow{color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.16em;margin:0 0 12px}
    h1{font:600 34px/1.18 Georgia,serif;margin:0 0 14px;letter-spacing:-.03em}
    p{color:var(--muted);font-size:13px;line-height:1.7;margin:0}
    .status{margin-top:20px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#f1e8df;font-size:12px;line-height:1.6;word-break:break-word}
    button{margin-top:16px;padding:11px 16px;border-radius:12px;border:1px solid var(--primary);background:var(--primary);color:#fff;font:700 13px system-ui;cursor:pointer}
    small{display:block;margin-top:16px;color:#968889;font-size:10px;line-height:1.6}
  </style>
</head>
<body>
<main><article>
  <div class="mark">W</div>
  <p class="eyebrow">PRIVATE WEDDING JOURNAL</p>
  <h1>WONI WEDDING</h1>
  <p>최신 웨딩 앱을 불러오고 있어.</p>
  <div class="status" id="status">업데이트 확인 중…</div>
  <button id="retry" hidden>다시 불러오기</button>
  <small>웨딩 계약 데이터와 로그인 정보는 이 로더에 저장하지 않아.</small>
</article></main>

<script type="module">
import { createClient } from 'https://esm.sh/@neondatabase/neon-js@0.7.0-beta';

const AUTH='https://ep-curly-block-b5ue1v7o.neonauth.c-7.us-east-2.aws.neon.tech/neondb/auth';
const API='https://ep-curly-block-b5ue1v7o.apirest.c-7.us-east-2.aws.neon.tech/neondb/rest/v1';
const status=document.querySelector('#status');
const retry=document.querySelector('#retry');
const APP_MARKER='<meta name="woni-'+'app-release" content="app"';
let attempts=0;

const client=createClient({
  auth:{url:AUTH,allowAnonymous:true},
  dataApi:{url:API}
});

function message(text,canRetry=false){
  status.textContent=text;
  retry.hidden=!canRetry;
}
async function sha256(text){
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function loadLatest(){
  retry.hidden=true;
  attempts+=1;
  try{
    message('최신 버전 확인 중…');
    const {data,error}=await client
      .from('wedding_public_releases')
      .select('version,html_source,html_sha256,published_at')
      .eq('channel','production')
      .order('version',{ascending:false})
      .limit(1);

    if(error) throw new Error(error.message||error.code||'release lookup failed');
    if(!Array.isArray(data)||data.length!==1) throw new Error('배포 가능한 버전이 없어.');

    const row=data[0];
    const html=String(row.html_source||'');

    if(!html.includes(APP_MARKER)){
      if(attempts<31){
        message('새 앱 버전을 준비하고 있어. 잠시만 기다려줘…');
        setTimeout(loadLatest,2000);
        return;
      }
      throw new Error('앱 릴리스가 아직 준비되지 않았어.');
    }

    if(!/^<!doctype html>/i.test(html.trimStart())||!html.includes('<title>WONI WEDDING</title>')||!html.includes('</html>')){
      throw new Error('앱 문서 검증에 실패했어.');
    }
    if(/WONI-\d{4}-\d{4}|postgres(?:ql)?:\/\//i.test(html)){
      throw new Error('공개 앱 코드 안전 검증에 실패했어.');
    }

    message('무결성 확인 중…');
    if(await sha256(html)!==row.html_sha256) throw new Error('앱 파일 무결성 검증에 실패했어.');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error('[WONI bootstrap]',e);
    message(String(e?.message||e||'최신 앱을 불러오지 못했어.').slice(0,240),true);
  }
}
retry.addEventListener('click',()=>{attempts=0;loadLatest();});
loadLatest();
</script>

<!--

This static loader intentionally contains no vendor records, owner email, password, setup token,

After this bootstrap has been installed once, future WONI WEDDING application changes only require a

This long comment is also intentional. The release feed applies a conservative minimum document size
to catch obviously truncated deployments. Keeping the bootstrap comfortably over that minimum allows
the existing deployment validation to accept it without weakening the safety rule used for app builds.
END WONI BOOTSTRAP SAFETY NOTES.
-->
</body>
</html>
