<!doctype html>
<html lang="ko">

  <style>

<body>
<main><article>

<script type="module">
import { createClient } from 'https://esm.sh/@neondatabase/neon-js@0.7.0-beta';

const AUTH='https://ep-curly-block-b5ue1v7o.neonauth.c-7.us-east-2.aws.neon.tech/neondb/auth';
const API='https://ep-curly-block-b5ue1v7o.apirest.c-7.us-east-2.aws.neon.tech/neondb/rest/v1';
const status=document.querySelector('#status');
const retry=document.querySelector('#retry');

const client=createClient({
  auth:{url:AUTH,allowAnonymous:true},
  dataApi:{url:API}
});

function message(text,canRetry=false){
  status.textContent=text;
  retry.hidden=!canRetry;
}
async function sha256(text){
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function applyUx15(html,version){
  if(Number(version)!==14) return html;
  const css="\n/* WONI WEDDING UX PATCH v15 */\n.master.ux15VendorCollapsed .tableWrap,.master.ux15VendorCollapsed .vendorCards{display:none!important}\n.ux15VendorSummary{margin:14px 0 2px}\n.ux15VendorToggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--fg);cursor:pointer;text-align:left}\n.ux15VendorToggle span{font-size:10px;color:var(--muted)}\n.ux15VendorToggle b{font-size:10px;color:var(--primary)}\n.ux15ConfirmPanel{margin:0 0 20px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 6px 18px rgba(74,48,52,.05)}\n.ux15ConfirmHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:9px}\n.ux15ConfirmHead span{display:block;color:var(--accent);font-size:8px;letter-spacing:.15em;font-weight:700}\n.ux15ConfirmHead h3{margin:3px 0 0;font:600 17px 'Noto Serif KR',serif}\n.ux15ConfirmHead strong{color:var(--primary);font:600 20px 'Noto Serif KR',serif}\n.ux15ConfirmList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}\n.ux15ConfirmItem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg);text-align:left;cursor:pointer}\n.ux15ConfirmItem>span{min-width:0}\n.ux15ConfirmItem b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.ux15ConfirmItem small{display:block;margin-top:2px;color:var(--muted);font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.ux15ConfirmItem em{font-style:normal;color:var(--primary);font-size:13px}\n.ux15PaymentNote{display:block;margin-top:9px;color:var(--muted);font-size:8.5px;line-height:1.5}\n.ux15ScheduleNames{display:block;color:var(--muted);font-size:9px;line-height:1.45;margin-top:3px}\n.ux15PhotoQuick{width:100%;margin-top:10px;padding:9px 11px}\n#data-backup{opacity:.76}\n@media(max-width:680px){\n  .topbar nav{flex:1;justify-content:center;gap:0}\n  .topbar nav a{padding:8px 7px!important;font-size:8px!important;line-height:1.1;min-width:48px}\n  .topbar nav a span{display:block;font-size:14px!important;margin-bottom:2px}\n  .ux15ConfirmPanel{padding:15px 14px;margin-bottom:14px}\n  .ux15ConfirmList{grid-template-columns:1fr}\n  .ux15VendorToggle{padding:12px}\n}\n";
  const js="\n(function(){\n  var timer=null;\n  function q(sel,root){return (root||document).querySelector(sel)}\n  function qa(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel))}\n  function text(el){return el&&el.textContent?el.textContent.trim():\"\"}\n  function validDate(v){return /^\\d{4}-\\d{2}-\\d{2}$/.test(v||\"\")?v:\"\"}\n  function digits(v){var n=parseInt(String(v||\"\").replace(/[^\\d-]/g,\"\"),10);return isNaN(n)?0:n}\n  function todayKst(){\n    try{return new Intl.DateTimeFormat(\"en-CA\",{timeZone:\"Asia/Seoul\",year:\"numeric\",month:\"2-digit\",day:\"2-digit\"}).format(new Date())}\n    catch(e){return new Date().toISOString().slice(0,10)}\n  }\n  function monthLabel(d){\n    try{return new Intl.DateTimeFormat(\"en-US\",{month:\"short\",timeZone:\"UTC\"}).format(new Date(d+\"T00:00:00Z\")).toUpperCase()}\n    catch(e){return \"\"}\n  }\n  function rows(){\n    return qa(\".vendorCard\").map(function(card){\n      var head=q(\".vendorCardHead\",card);\n      var meta=qa(\".vendorMeta span\",card);\n      var booking=\"\",payment=\"\";\n      meta.forEach(function(s){\n        var label=text(s);\n        var value=text(q(\"b\",s));\n        if(label.indexOf(\"일정\")===0)booking=value;\n        if(label.indexOf(\"결제\")===0)payment=value;\n      });\n      var balance=\"\";\n      qa(\".vendorMoney>div\",card).forEach(function(d){\n        if(text(q(\"span\",d))===\"잔금\")balance=text(q(\"b\",d));\n      });\n      return {\n        card:card,\n        name:text(q(\"h3\",head)),\n        product:text(q(\"small\",head)),\n        category:text(q(\".category\",head)),\n        booking:booking,\n        payment:payment,\n        balance:balance,\n        confirm:text(q(\".vendorConfirm\",card)).replace(/^확인\\s*·\\s*/,\"\")\n      };\n    });\n  }\n  function openVendor(row){\n    var btn=q(\".vendorEdit\",row.card);\n    if(btn)btn.click();\n  }\n  function patchNav(){\n    var nav=q(\".topbar nav\");\n    if(!nav||nav.dataset.ux15)return;\n    nav.dataset.ux15=\"1\";\n    nav.innerHTML='<a href=\"#top\"><span>♡</span>HOME</a><a href=\"#vendors\"><span>▤</span>계약</a><a href=\"#photo\" data-ux15-nav=\"photo\"><span>▧</span>PHOTO</a><a href=\"#wedding-day\" data-ux15-nav=\"wedding\"><span>✓</span>본식</a>';\n    var photo=q('[data-ux15-nav=\"photo\"]',nav);\n    var wedding=q('[data-ux15-nav=\"wedding\"]',nav);\n    if(photo)photo.addEventListener(\"click\",function(e){e.preventDefault();var x=q(\"#photo\");if(x)x.click()});\n    if(wedding)wedding.addEventListener(\"click\",function(e){e.preventDefault();var x=q(\"#wedding-day\");if(x)x.click()});\n  }\n  function patchVendorSummary(rs){\n    var master=q(\"#vendors\");\n    if(!master||q(\".ux15VendorSummary\",master))return;\n    var confirmCount=rs.filter(function(r){return !!r.confirm}).length;\n    var box=document.createElement(\"div\");\n    box.className=\"ux15VendorSummary\";\n    var btn=document.createElement(\"button\");\n    btn.type=\"button\";\n    btn.className=\"ux15VendorToggle\";\n    var left=document.createElement(\"span\");\n    left.textContent=\"계약 \"+rs.length+\"건 · 확인 필요 \"+confirmCount+\"건\";\n    var right=document.createElement(\"b\");\n    right.textContent=\"전체 보기 ↓\";\n    btn.appendChild(left);btn.appendChild(right);box.appendChild(btn);\n    var target=q(\".tableWrap\",master)||q(\".vendorCards\",master);\n    if(target)master.insertBefore(box,target);else master.appendChild(box);\n    master.classList.add(\"ux15VendorCollapsed\");\n    btn.addEventListener(\"click\",function(){\n      var collapsed=master.classList.toggle(\"ux15VendorCollapsed\");\n      right.textContent=collapsed?\"전체 보기 ↓\":\"접기 ↑\";\n    });\n  }\n  function paymentCard(){\n    return qa(\".nextGrid>.card\").find(function(c){return text(q(\"h3\",c)).indexOf(\"다음 결제\")>=0||text(q(\"h3\",c)).indexOf(\"결제일 확인\")>=0});\n  }\n  function patchPayments(rs){\n    var card=paymentCard();\n    if(!card||card.dataset.ux15pay)return;\n    card.dataset.ux15pay=\"1\";\n    var actual=rs.filter(function(r){return !!validDate(r.payment)}).sort(function(a,b){return a.payment.localeCompare(b.payment)});\n    card.innerHTML=\"\";\n    var h=document.createElement(\"h3\");\n    if(actual.length){\n      h.textContent=\"₩ 다음 결제\";card.appendChild(h);\n      var list=document.createElement(\"div\");list.className=\"paymentList\";card.appendChild(list);\n      actual.slice(0,3).forEach(function(r){\n        var btn=document.createElement(\"button\");btn.type=\"button\";btn.className=\"paymentRow\";\n        var s=document.createElement(\"span\");var b=document.createElement(\"b\");b.textContent=r.name;\n        var sm=document.createElement(\"small\");sm.textContent=(r.product||r.category)+\" · 결제 \"+r.payment;\n        var strong=document.createElement(\"strong\");strong.textContent=r.balance||\"잔금 확인\";\n        s.appendChild(b);s.appendChild(sm);btn.appendChild(s);btn.appendChild(strong);\n        btn.addEventListener(\"click\",function(){openVendor(r)});list.appendChild(btn);\n      });\n    }else{\n      h.textContent=\"⚠ 결제일 확인 필요\";card.appendChild(h);\n      var missing=rs.filter(function(r){return !validDate(r.payment)&&(digits(r.balance)>0||/결제|잔금|결제일/.test(r.confirm||\"\"))});\n      missing.sort(function(a,b){return (validDate(a.booking)||\"9999-12-31\").localeCompare(validDate(b.booking)||\"9999-12-31\")});\n      var list2=document.createElement(\"div\");list2.className=\"paymentList\";card.appendChild(list2);\n      missing.slice(0,3).forEach(function(r){\n        var btn=document.createElement(\"button\");btn.type=\"button\";btn.className=\"paymentRow\";\n        var s=document.createElement(\"span\");var b=document.createElement(\"b\");b.textContent=r.name;\n        var sm=document.createElement(\"small\");sm.textContent=r.confirm||\"잔금은 있으나 결제일 미정\";\n        var strong=document.createElement(\"strong\");strong.textContent=\"미정\";\n        s.appendChild(b);s.appendChild(sm);btn.appendChild(s);btn.appendChild(strong);\n        btn.addEventListener(\"click\",function(){openVendor(r)});list2.appendChild(btn);\n      });\n      var note=document.createElement(\"small\");note.className=\"ux15PaymentNote\";\n      note.textContent=\"실제 결제일을 입력하면 자동으로 ‘다음 결제’로 정렬돼.\";\n      card.appendChild(note);\n    }\n  }\n  function patchSchedule(rs){\n    var card=qa(\".nextGrid>.card\").find(function(c){return text(q(\"h3\",c)).indexOf(\"다음 일정\")>=0});\n    if(!card||card.dataset.ux15schedule)return;\n    card.dataset.ux15schedule=\"1\";\n    var today=todayKst();\n    var dated=rs.filter(function(r){var d=validDate(r.booking);return d&&d>=today}).sort(function(a,b){return a.booking.localeCompare(b.booking)});\n    if(!dated.length)return;\n    var date=dated[0].booking;\n    var group=dated.filter(function(r){return r.booking===date});\n    var label=date===\"2027-05-22\"?\"WEDDING DAY\":group.some(function(r){return r.category===\"웨딩촬영\"||r.category===\"촬영 플라워\"})?\"WEDDING SHOOT\":\"NEXT SCHEDULE\";\n    var title=date===\"2027-05-22\"?\"본식 일정\":label===\"WEDDING SHOOT\"?\"웨딩촬영\":group[0].name;\n    card.innerHTML=\"\";\n    var h=document.createElement(\"h3\");h.textContent=\"◷ 다음 일정\";card.appendChild(h);\n    var ev=document.createElement(\"div\");ev.className=\"event\";\n    var dbox=document.createElement(\"div\");dbox.className=\"date\";\n    var day=document.createElement(\"b\");day.textContent=date.slice(8,10);\n    var mon=document.createElement(\"span\");mon.textContent=monthLabel(date);\n    dbox.appendChild(day);dbox.appendChild(mon);\n    var detail=document.createElement(\"div\");\n    var eye=document.createElement(\"p\");eye.className=\"eyebrow\";eye.textContent=label;\n    var hh=document.createElement(\"h2\");hh.textContent=group.length>1?title+\" · 관련 \"+group.length+\"건\":title;\n    var small=document.createElement(\"small\");small.textContent=date;\n    var names=document.createElement(\"span\");names.className=\"ux15ScheduleNames\";\n    var unique=Array.from(new Set(group.map(function(r){return r.name})));\n    names.textContent=unique.slice(0,3).join(\" · \")+(unique.length>3?\" 외 \"+(unique.length-3)+\"곳\":\"\");\n    detail.appendChild(eye);detail.appendChild(hh);detail.appendChild(small);detail.appendChild(names);\n    ev.appendChild(dbox);ev.appendChild(detail);card.appendChild(ev);\n  }\n  function patchConfirm(rs){\n    if(q(\"#ux15-confirm-panel\"))return;\n    var list=rs.filter(function(r){return !!r.confirm});\n    var grid=q(\".nextGrid\");\n    if(!grid||!grid.parentNode)return;\n    var panel=document.createElement(\"section\");panel.id=\"ux15-confirm-panel\";panel.className=\"ux15ConfirmPanel\";\n    var head=document.createElement(\"div\");head.className=\"ux15ConfirmHead\";\n    var hd=document.createElement(\"div\");var sp=document.createElement(\"span\");sp.textContent=\"NEEDS CHECK\";\n    var h=document.createElement(\"h3\");h.textContent=\"아직 확인해야 하는 것\";\n    var count=document.createElement(\"strong\");count.textContent=String(list.length);\n    hd.appendChild(sp);hd.appendChild(h);head.appendChild(hd);head.appendChild(count);panel.appendChild(head);\n    var body=document.createElement(\"div\");body.className=\"ux15ConfirmList\";panel.appendChild(body);\n    if(!list.length){\n      var empty=document.createElement(\"div\");empty.className=\"emptyMini\";empty.textContent=\"현재 확인 필요 항목이 없어.\";body.appendChild(empty);\n    }else{\n      list.slice(0,6).forEach(function(r){\n        var btn=document.createElement(\"button\");btn.type=\"button\";btn.className=\"ux15ConfirmItem\";\n        var s=document.createElement(\"span\");var b=document.createElement(\"b\");b.textContent=r.name;\n        var sm=document.createElement(\"small\");sm.textContent=r.confirm;\n        var em=document.createElement(\"em\");em.textContent=\"→\";\n        s.appendChild(b);s.appendChild(sm);btn.appendChild(s);btn.appendChild(em);\n        btn.addEventListener(\"click\",function(){openVendor(r)});body.appendChild(btn);\n      });\n    }\n    grid.parentNode.insertBefore(panel,grid.nextSibling);\n  }\n  function patchPhotoQuick(){\n    var card=q(\"#home-photo-progress\");\n    if(!card||q(\".ux15PhotoQuick\",card))return;\n    var summary=text(q(\"#photo small\"));\n    var ym=summary.match(/❤️\\s*(\\d+)/);var fm=summary.match(/⭐\\s*(\\d+)/);\n    var yes=ym?Number(ym[1]):0;var final=fm?Number(fm[1]):0;\n    var btn=document.createElement(\"button\");btn.type=\"button\";btn.className=\"secondary ux15PhotoQuick\";\n    btn.textContent=yes>0&&final===0?\"⭐ 좋아요 \"+yes+\"장에서 최종후보 고르기\":final>0?\"PHOTO BOOK 열기 · 최종 \"+final:\"사진 고르기\";\n    btn.addEventListener(\"click\",function(e){\n      e.preventDefault();e.stopPropagation();\n      var entry=q(\"#photo\");if(entry)entry.click();\n      if(yes>0&&final===0){\n        [650,1300,2200].forEach(function(ms){setTimeout(function(){\n          var frame=q(\"#photo-book-frame\");\n          if(frame&&frame.contentWindow)frame.contentWindow.postMessage({type:\"WONI_VIEW_YES\"},\"https://woni-wedding-select.floot.app\");\n        },ms)});\n      }\n    });\n    card.appendChild(btn);\n  }\n  function run(){\n    if(!q(\".shell\"))return;\n    var rs=rows();if(!rs.length)return;\n    patchNav();patchVendorSummary(rs);patchPayments(rs);patchSchedule(rs);patchConfirm(rs);patchPhotoQuick();\n  }\n  function schedule(){if(timer)clearTimeout(timer);timer=setTimeout(run,40)}\n  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});\n  window.addEventListener(\"hashchange\",schedule);\n  schedule();\n})();\n";
  const injected='<style id="woni-ux15-style">'+css+'</style><script id="woni-ux15-script">'+js+'<\\/script>';
  return html
    .replace('name="woni-app-version" content="14"','name="woni-app-version" content="15"')
    .replace('</body>',injected+'</body>');
}

async function loadApp(){
  retry.hidden=true;
  try{
    message('최신 앱 버전 확인 중…');

    const {data,error}=await client
      .from('wedding_app_releases')
      .select('version,html_source,html_sha256,published_at')
      .order('version',{ascending:false})
      .limit(1);

    if(error) throw new Error(error.message||error.code||'app release lookup failed');
    if(!Array.isArray(data)||data.length!==1) throw new Error('사용할 수 있는 앱 버전이 없어.');

    const row=data[0];
    const html=String(row.html_source||'');

    if(!/^<!doctype html>/i.test(html.trimStart())) throw new Error('앱 문서 시작 형식이 잘못됐어.');
    if(!html.includes('<title>WONI WEDDING</title>')) throw new Error('WONI WEDDING 앱 문서가 아니야.');
    if(!html.includes('<meta name="woni-app-release" content="app"')) throw new Error('앱 릴리스 마커가 없어.');
    if(!html.includes('</html>')) throw new Error('앱 문서가 잘린 것 같아.');
    if(/WONI-\d{4}-\d{4}|postgres(?:ql)?:\/\//i.test(html)) throw new Error('공개 앱 코드 안전 검증에 실패했어.');

    message('앱 파일 무결성 확인 중…');
    const actual=await sha256(html);
    if(actual!==row.html_sha256) throw new Error('앱 파일 무결성 검증에 실패했어.');

    const runtimeHtml=applyUx15(html,row.version);
    document.open();
    document.write(runtimeHtml);
    document.close();
  }catch(e){
    console.error('[WONI runtime loader]',e);
    message(String(e?.message||e||'최신 앱을 불러오지 못했어.').slice(0,240),true);
  }
}

retry.addEventListener('click',loadApp);
loadApp();
</script>

<!--
WONI RUNTIME LOADER V3
This document is intentionally a loader and not the wedding application itself.

The GitHub Pages origin remains stable. The loader obtains only the newest validated public front-end
application release from the dedicated wedding_app_releases feed. The actual vendor, money, task and
owner records remain in separate private tables protected by PostgreSQL grants and Row Level Security.

The public release feed cannot be used to read private vendor data. Anonymous users have SELECT access
only to the front-end application release table, which is required so a browser can download the app
before a user signs in. The app itself uses a separate non-anonymous Neon client for all owner-only
queries after authentication.

Each front-end release is accompanied by a SHA-256 digest. This loader recalculates the digest in the
browser before replacing the current document. A release must also contain the WONI WEDDING title,
the dedicated application marker, a valid HTML document ending, and must not contain obvious static
database passwords or an owner setup-token shaped string.

The existing GitHub Actions workflow may continue to run. It watches wedding_public_releases, whose
newest stable record is this runtime loader. Day-to-day app versions are now stored separately in
wedding_app_releases, so normal app updates do not cause GitHub to replace this loader. That separation
is deliberate and prevents the scheduled workflow from fighting with the direct runtime-update design.

Runtime loader V3 applies a temporary, data-safe UX patch only when the newest database release is version 14. The patch changes presentation and navigation only; it does not write private wedding data. A future database release version 15 or newer bypasses this compatibility patch automatically.\n\nAfter this loader reaches GitHub once, future app development uses the following path:
ChatGPT prepares and validates a new app HTML release, inserts it into wedding_app_releases, and the
browser loads it on the next refresh. No phone download, file rename, GitHub upload or manual workflow
run is required for ordinary app changes.

If Neon is temporarily unreachable or an application release fails validation, the loader leaves the
current browser origin intact and shows a retry button. It never deletes wedding data, clears the owner
record, changes authentication settings, or writes to private wedding tables while loading an update.

This comment intentionally keeps the release document above the conservative minimum byte length used
by the public deployment feed. It is documentation and a truncation guard; it contains no credentials
or private wedding information.
END WONI RUNTIME LOADER V3.
-->
